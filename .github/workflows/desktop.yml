name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload installers and screenshots (requires available artifact storage)
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
            command: npm run dist:win
          - name: macOS Apple Silicon
            os: macos-latest
            arch: arm64
            command: npm run dist:mac -- --arm64
          - name: macOS Intel
            os: macos-latest
            arch: x64
            command: npm run dist:mac -- --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:motionkit
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        with:
          name: Forma-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts }}
        with:
          name: Screenshots-${{ runner.os }}-${{ matrix.arch }}
          path: test-results/*.png
          retention-days: 7
